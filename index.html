import sys
from calculator import Calculator
from math_service import MathService

USAGE = "Usage: add A B | divide A B | add_divide A B C"

class CalculatorApp:
    def __init__(self):
        self.calc = Calculator()
        self.service = MathService(self.calc)

    def run(self, args):
        """Returns (exit_code, output). 0 = ok, 1 = error, 2 = bad usage."""
        if not args:
            return 2, USAGE
        try:
            nums = [int(x) for x in args[1:]]
        except ValueError:
            return 2, "Error: arguments must be integers"
        try:
            if args[0] == "add" and len(nums) == 2:
                return 0, str(self.calc.add(*nums))
            if args[0] == "divide" and len(nums) == 2:
                return 0, str(self.calc.divide(*nums))
            if args[0] == "add_divide" and len(nums) == 3:
                return 0, str(self.service.add_and_divide(*nums))
        except ValueError as e:
            return 1, "Error: " + str(e)
        return 2, USAGE

if __name__ == "__main__":
    code, out = CalculatorApp().run(sys.argv[1:])
    print(out)
    sys.exit(code)`,

app:`// CalculatorApp.java  (the whole application, with an entry point)
public class CalculatorApp {
    public record Result(int code, String output) {}

    private static final String USAGE = "Usage: add A B | divide A B | add_divide A B C";
    private final Calculator calc = new Calculator();
    private final MathService service = new MathService(calc);

    // code: 0 = ok, 1 = error, 2 = bad usage
    public Result run(String... args) {
        if (args.length == 0) return new Result(2, USAGE);
        int[] n = new int[args.length - 1];
        try {
            for (int i = 1; i < args.length; i++) n[i - 1] = Integer.parseInt(args[i]);
        } catch (NumberFormatException e) {
            return new Result(2, "Error: arguments must be integers");
        }
        try {
            if (args[0].equals("add") && n.length == 2)
                return new Result(0, "" + calc.add(n[0], n[1]));
            if (args[0].equals("divide") && n.length == 2)
                return new Result(0, "" + calc.divide(n[0], n[1]));
            if (args[0].equals("add_divide") && n.length == 3)
                return new Result(0, "" + service.addAndDivide(n[0], n[1], n[2]));
        } catch (IllegalArgumentException e) {
            return new Result(1, "Error: " + e.getMessage());
        }
        return new Result(2, USAGE);
    }

    public static void main(String[] args) {
        Result r = new CalculatorApp().run(args);
        System.out.println(r.output());
        System.exit(r.code());
    }
}`,

const JX={IllegalArgumentException:"RuntimeException",ArithmeticException:"RuntimeException",IllegalStateException:"RuntimeException",NullPointerException:"RuntimeException",RuntimeException:"Exception",Exception:"Throwable"};
const isA=(n,t)=>{while(n){if(n===t)return true;n=JX[n]}return false};
class JEx extends Error{constructor(n,m){super(m);this.jn=n}}
class Calculator{add(a,b){return (a+b)|0}divide(a,b){if(b===0)throw new JEx("IllegalArgumentException","Division by zero is not allowed");return Math.trunc(a/b)}}
class MathService{constructor(c){this.calculator=c}addAndDivide(a,b,d){const s=this.calculator.add(a,b);return this.calculator.divide(s,d)}}
class CalculatorApp{constructor(){this.calc=new Calculator();this.svc=new MathService(this.calc)}
run(...a){const U="Usage: add A B | divide A B | add_divide A B C",R=(c,o)=>({code(){return c},output(){return o}});if(!a.length)return R(2,U);
const n=a.slice(1).map(x=>/^-?\d+$/.test(x)?parseInt(x,10):NaN);if(n.some(isNaN))return R(2,"Error: arguments must be integers");
try{if(a[0]==="add"&&n.length===2)return R(0,""+this.calc.add(n[0],n[1]));if(a[0]==="divide"&&n.length===2)return R(0,""+this.calc.divide(n[0],n[1]));if(a[0]==="add_divide"&&n.length===3)return R(0,""+this.svc.addAndDivide(n[0],n[1],n[2]))}catch(e){return R(1,"Error: "+e.message)}return R(2,U)}}
String.prototype.contains=function(s){return this.includes(s)};String.prototype.equals=function(s){return this.valueOf()===s};String.prototype.isEmpty=function(){return this.length===0};
const AF=m=>{const e=new Error(m);e.af=1;return e};
const JA={assertEquals(e,a,x){const dl=typeof x==="number";if(dl?Math.abs(e-a)>x:e!==a)throw AF((typeof x==="string"?x+" ==> ":"")+"expected: <"+e+"> but was: <"+a+">")},
assertNotEquals(e,a){if(e===a)throw AF("expected: not equal but was: <"+a+">")},
assertTrue(c){if(c!==true)throw AF("expected: <true> but was: <"+c+">")},
assertFalse(c){if(c!==false)throw AF("expected: <false> but was: <"+c+">")},
assertNull(v){if(v!=null)throw AF("expected: <null> but was: <"+v+">")},
assertNotNull(v){if(v==null)throw AF("expected: not <null>")},
assertThrows(t,fn){try{fn()}catch(e){if(e.af||e instanceof ReferenceError||e instanceof TypeError)throw e;if(e.jn&&isA(e.jn,t))return e;throw AF("Unexpected exception type thrown, expected: <"+t+"> but was: <"+(e.jn||e.name)+">")}throw AF("Expected "+t+" to be thrown, but nothing was thrown.")},
assertDoesNotThrow(fn){try{return fn()}catch(e){if(e.af||e instanceof ReferenceError||e instanceof TypeError)throw e;throw AF("Unexpected exception thrown: "+(e.jn||e.name)+": "+e.message)}},
fail(m){throw AF(m||"")}};
const tj=b=>b.replace(/\b([A-Z]\w*)\.class\b/g,'"$1"').replace(/(\d)[Ll]\b/g,"$1").replace(/\b(?:final\s+)?(?:int|long|double|float|boolean|String|var|CalculatorApp\.Result|CalculatorApp|Calculator|MathService|Result)\s+(\w+)\s*([=;])/g,"let $1 $2").replace(/->/g,"=>");
function jparse(src){src=src.replace(/\/\*[\s\S]*?\*\/|\/\/.*$/gm,"").replace(/^\s*(import|package)\s.*$/gm,"");
const m=/class\s+(\w+)[^{]*\{/.exec(src);if(!m)throw new Error("error: class, interface, enum, or record expected");
const items=[];let h="",b0=0,d=0,q=null,closed=false;
for(let i=m.index+m[0].length;i<src.length;i++){const c=src[i];
if(q){if(c==="\\")i++;else if(c===q)q=null;if(!d)h+=c;continue}
if(c==='"'||c==="'"){q=c;if(!d)h+=c;continue}
if(c==="{"){if(!d)b0=i+1;d++;continue}
if(c==="}"){if(!d){closed=true;break}d--;if(!d){items.push({h:h.trim(),body:src.slice(b0,i)});h=""}continue}
if(!d){if(c===";"){items.push({h:h.trim(),field:1});h=""}else h+=c}}
if(!closed)throw new Error("error: reached end of file while parsing");return{name:m[1],items}}
function semi(b){let p=0;for(const r of b.split("\n")){const l=r.replace(/"(?:\\.|[^"\\])*"/g,'""').trim();if(!l)continue;p+=(l.match(/\(/g)||[]).length-(l.match(/\)/g)||[]).length;if(p>0)continue;if(!/[;{}(,]$|->$|[+\-*\/&|?:=]$|^(\}\s*)?(else|if|for|while|try|catch)\b/.test(l))return l}return null}
function runJava(src){const head="$ mvn test\n",ce=m=>({n:0,bad:1,text:head+"[ERROR] COMPILATION ERROR\n[ERROR] "+m+"\nBUILD FAILURE"});
let P;try{P=jparse(src)}catch(e){return ce(e.message)}
const fields=[],before=[],tests=[];
for(const x of P.items){if(x.field){const f=/(\w+)\s*(?:=\s*([\s\S]+))?$/.exec(x.h.replace(/@\w+/g,"").trim());if(f)fields.push([f[1],f[2]||"null"])}
else if(/@Test\b/.test(x.h)){const n=/(\w+)\s*\(\s*\)\s*$/.exec(x.h);if(!n)return ce("error: @Test methods must take no parameters");tests.push([n[1],x.body,/@Disabled/.test(x.h)])}
else if(/@BeforeEach\b/.test(x.h))before.push(["setup",x.body])}
const mk=(nm,body)=>{const s=semi(body);if(s)throw new Error("error: ';' expected\n[ERROR]   in "+nm+"(): "+s.trim());try{return new Function("F","Calculator","MathService","CalculatorApp","JEx","with(F){"+tj(body)+"\n}")}catch(e){throw new Error("error: illegal start of expression ("+e.message+")\n[ERROR]   in "+nm+"()")}};
let T,B,FI;try{T=tests.map(t=>({n:t[0],f:mk(t[0],t[1]),skip:t[2]}));B=before.map(b=>mk(b[0],b[1]));FI=fields.map(f=>mk(f[0],f[0]+" = "+f[1]+";"))}catch(e){return ce(e.message)}

for(const t of T){if(t.skip){sk++;log.push("[WARNING]   ⊘ "+t.n+" (disabled)");continue}
const F=Object.create(JA);fields.forEach(f=>F[f[0]]=null);
try{[...FI,...B,t.f].forEach(f=>f(F,Calculator,MathService,CalculatorApp,JEx));ok++;log.push("[INFO]    ✓ "+t.n)}
catch(e){if(e.af){fl++;log.push("[ERROR]   ✗ "+t.n+"\n            AssertionFailedError: "+e.message)}
else if(e instanceof ReferenceError||/is not a function|is not a constructor/.test(e.message)){const s=/(\w+) is not (?:a function|a constructor|defined)/.exec(e.message);return ce("error: cannot find symbol\n[ERROR]   symbol: "+(e instanceof ReferenceError?"variable ":"method/class ")+(s?s[1]:"?")+"\n[ERROR]   in "+t.n+"()")}
else{er++;log.push("[ERROR]   ✗ "+t.n+"\n            "+(e.jn||e.name)+": "+e.message)}}}
const n=ok+fl+er,bad=fl+er;if(!T.length)log.push("[WARNING] No tests found. Did you add @Test?");
